# Alembic configuration.
#
# The database URL is NOT stored here. env.py reads DATABASE_URL_SYNC from the
# environment via certex.config, so migrations always target the same database the
# application is configured for and no credential is ever committed.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/../api
path_separator = os

# Migration filenames sort chronologically and read as a changelog.
file_template = %%(rev)s_%%(slug)s

# Timestamps in migration files are UTC.
timezone = UTC

[post_write_hooks]
# `exec` rather than `console_scripts`: the latter resolves entry points from the
# interpreter running alembic, which is not always the one holding ruff.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = python
ruff_format.options = -m ruff format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
