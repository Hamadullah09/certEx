[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certex-worker"
version = "0.1.0"
description = "CertExtract Celery workers - pipeline stage task wrappers"
requires-python = ">=3.11,<3.13"

# The pipeline logic, ORM models and configuration all live in the `certex`
# package under /api, which both services install. The worker package holds only
# the Celery task wrappers, so it declares no dependencies of its own.
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["worker*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
# The pipeline code these tasks call lives in ../api; point mypy at it so the
# worker can be checked on its own.
mypy_path = "../api"
# Celery's decorators and signal connectors are untyped, and every task and signal
# handler in this package goes through one. The bodies are still checked strictly.
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = [
  "celery.*",
  "kombu.*",
  "fitz.*",
  "pdfplumber.*",
  "docx.*",
  "magic.*",
  "cv2.*",
  "pytesseract.*",
]
ignore_missing_imports = true
