[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certex"
version = "0.1.0"
description = "CertExtract - certificate document data extraction platform (shared core, API surface)"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }

dependencies = [
  # --- Web / API -------------------------------------------------------------
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "gunicorn==23.0.0",
  "python-multipart==0.0.20",
  "sse-starlette==2.2.1",
  "httpx==0.28.1",

  # --- Config / validation ---------------------------------------------------
  "pydantic==2.10.5",
  "pydantic-settings==2.7.1",
  "email-validator==2.2.0",

  # --- Persistence -----------------------------------------------------------
  "SQLAlchemy==2.0.37",
  "alembic==1.14.1",
  "asyncpg==0.30.0",
  "psycopg[binary]==3.2.4",
  "greenlet==3.1.1",

  # --- Queue / cache ---------------------------------------------------------
  "celery[redis]==5.4.0",
  "redis==5.2.1",

  # --- Object storage --------------------------------------------------------
  "boto3==1.36.3",
  "botocore==1.36.3",

  # --- Auth / crypto ---------------------------------------------------------
  "PyJWT==2.10.1",
  "bcrypt==4.2.1",

  # --- Logging ---------------------------------------------------------------
  "structlog==25.1.0",

  # --- PDF / DOCX ------------------------------------------------------------
  "pypdf==5.1.0",
  "pdfplumber==0.11.5",
  "PyMuPDF==1.25.2",
  "python-docx==1.1.2",
  "mammoth==1.9.0",

  # --- OCR / imaging ---------------------------------------------------------
  # numpy is held below 2.0 because paddlepaddle 2.6.x is built against 1.x.
  "numpy==1.26.4",
  "opencv-python-headless==4.10.0.84",
  "Pillow==11.1.0",
  "pytesseract==0.3.13",

  # --- Field extraction helpers ---------------------------------------------
  "rapidfuzz==3.11.0",
  "dateparser==1.2.0",
  "python-magic==0.4.27",

  # --- Export ----------------------------------------------------------------
  "openpyxl==3.1.5",

  # --- LLM providers ---------------------------------------------------------
  "anthropic==0.45.0",
  "openai==1.59.9",
]

[project.optional-dependencies]
# PaddleOCR is the secondary OCR engine. Split into an extra because the
# paddlepaddle wheel is ~400 MB and is only installed in the worker image.
paddle = [
  "paddlepaddle==2.6.2",
  "paddleocr==2.9.1",
]

dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.26.0",
  "pytest-cov==6.0.0",
  "pytest-timeout==2.3.1",
  "mypy==1.14.1",
  "ruff==0.9.2",
  "types-dateparser==1.2.0.20240420",
  "types-openpyxl==3.1.5.20241225",
  "boto3-stubs[s3]==1.36.3",
  # Used to BUILD the test fixture corpus (real PDFs, not recorded output).
  "reportlab==4.2.5",
  "psutil==6.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["certex*"]

[tool.setuptools.package-data]
certex = ["py.typed", "resources/*.txt", "resources/*.json"]

# =============================================================================
# Ruff
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # bugbear
  "C4",        # comprehensions
  "SIM",       # simplify
  "ASYNC",     # async correctness
  "S",         # bandit security
  "BLE",       # blind except - each one must be deliberate and commented
  "RUF",
  "ANN",       # missing annotations - type safety is mandatory here
]
ignore = [
  "ANN401",  # Dynamic typing via Any is banned outright by lint rule TID below
  "B008",    # FastAPI Depends() in defaults is the documented idiom
  "S101",    # assert is allowed (used in tests and internal invariants)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S105", "S106", "S311", "S608", "E501"]
"certex/db/models.py" = ["A003"]
# S105 flags any string assigned to a name containing TOKEN/SECRET. These are
# enum members and error codes named after tokens, not credentials.
"certex/enums.py" = ["S105"]
"certex/core/errors.py" = ["S105"]
"certex/core/security.py" = ["S105"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
suppress-none-returning = true

# =============================================================================
# mypy - strict. `Any` crossing a module boundary is an error.
# =============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_explicit = false
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = [
  "pdfplumber.*",
  "fitz.*",
  "pytesseract.*",
  "paddleocr.*",
  "cv2.*",
  "magic.*",
  "mammoth.*",
  "docx.*",
  "celery.*",
  "kombu.*",
  "reportlab.*",
  "sse_starlette.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
# Session scope for both: the database engine is session-scoped, and asyncpg
# connections cannot cross event loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
timeout = 900
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: pure-logic tests, no external services",
  "integration: needs postgres/redis/minio",
  "ocr: needs the tesseract binary",
  "paddle: needs paddleocr installed",
  "soffice: needs LibreOffice headless",
  "llm: needs a reachable LLM provider (skipped unless LLM_API_KEY is set)",
  "golden: field-level accuracy assertions against hand-labelled fixtures",
  "load: 1000-document throughput and memory profile (slow)",
  "e2e: full browser flow",
]
filterwarnings = [
  "error::DeprecationWarning:certex.*",
]
